<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="400" height="500">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FDF8F3;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F5EDE4;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="wax" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#D4BC7E;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#C9A962;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#B8984F;stop-opacity:1" />
    </linearGradient>
    
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2" />
    </filter>
  </defs>
  
  <!-- Fond -->
  <rect width="400" height="500" fill="url(#bg)"/>
  
  <!-- Texture lin -->
  <pattern id="linen" x="0" y="0" width="10" height="10" patternUnits="userSpaceOnUse">
    <path d="M0,5 L10,5 M5,0 L5,10" stroke="#E8DDD1" stroke-width="0.5" opacity="0.3"/>
  </pattern>
  <rect width="400" height="500" fill="url(#linen)"/>
  
  <!-- Bougie sculptée stylisée -->
  <g transform="translate(200, 280)">
    <!-- Forme abstraite organique -->
    <path d="M-60,140 
             C-80,120 -85,80 -75,50 
             C-65,10 -40,-30 -20,-60
             C-10,-80 10,-85 25,-75
             C45,-65 55,-40 50,-10
             C45,20 60,60 70,90
             C75,110 60,140 60,140
             Z" 
          fill="url(#wax)" 
          opacity="0.9">
      <animate attributeName="d" 
                dur="6s" 
                repeatCount="indefinite"
                values="
                  M-60,140 C-80,120 -85,80 -75,50 C-65,10 -40,-30 -20,-60 C-10,-80 10,-85 25,-75 C45,-65 55,-40 50,-10 C45,20 60,60 70,90 C75,110 60,140 60,140 Z;
                  M-58,140 C-78,120 -83,80 -73,50 C-63,10 -38,-30 -18,-60 C-8,-80 12,-85 27,-75 C47,-65 57,-40 52,-10 C47,20 62,60 72,90 C77,110 62,140 62,140 Z;
                  M-60,140 C-80,120 -85,80 -75,50 C-65,10 -40,-30 -20,-60 C-10,-80 10,-85 25,-75 C45,-65 55,-40 50,-10 C45,20 60,60 70,90 C75,110 60,140 60,140 Z
                "
      />
    </path>
    
    <!-- Mèche -->
    <line x1="15" y1="-75" x2="15" y2="-95" stroke="#4A4A4A" stroke-width="2"/>
    <!-- Flamme -->
    <path d="M15,-100 Q22,-115 15,-125 Q8,-115 15,-100" fill="#FFD54F" opacity="0.8">
      <animate attributeName="d" 
                dur="0.1s" 
                repeatCount="indefinite"
                values="
                  M15,-100 Q22,-115 15,-125 Q8,-115 15,-100;
                  M15,-100 Q24,-117 15,-127 Q6,-117 15,-100;
                  M15,-100 Q22,-115 15,-125 Q8,-115 15,-100
                "
      />
    </path>
    
    <!-- Ombre sous la bougie -->
    <ellipse cx="5" cy="142" rx="65" ry="12" fill="#000" opacity="0.1" filter="url(#soft)"/>
  </g>
  
  <!-- Texte -->
  <text x="200" y="420" text-anchor="middle" font-family="Georgia, serif" font-size="16" fill="#8B7355">
    <tspan x="200" dy="0">✦ Bougie Artisanale ✦</tspan>
    <tspan x="200" dy="28" font-size="13" fill="#A0927B">Image à venir</tspan>
  </text>
</svg>
